[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preset-worker"
version = "0.1.0"
description = "Preset submission enrichment and publication worker"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
preset-worker = "preset_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
