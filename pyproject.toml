[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preset-worker"
dynamic = ["version"]
description = "Preset submission enrichment and publication worker"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
preset-worker = "preset_worker.cli:main"
coverage-sync = "preset_worker.coverage_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "preset_worker.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
